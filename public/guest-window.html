<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:">
    <title>RunContainer — App window</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            background: #0e1116;
            color: #e8eefc;
            font-family: "Segoe UI", system-ui, sans-serif;
            display: flex;
            flex-direction: column;
        }
        /* The hosted app or VM window is parented below this strip, so the header
           stays visible and the window keeps RunContainer's identity. */
        header {
            height: 56px;
            flex: none;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 14px;
            border-bottom: 1px solid rgba(79, 216, 180, 0.22);
            background: linear-gradient(180deg, #121821, #0a0d11);
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 8px 20px -18px #000;
        }
        .mark {
            width: 30px;
            height: 30px;
            flex: none;
            display: grid;
            place-items: center;
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(63, 207, 170, 0.42), rgba(43, 179, 144, 0.16));
            box-shadow: 0 0 0 1px rgba(140, 233, 208, 0.28) inset;
            color: #d6fbf1;
            font-size: 16px;
        }
        .titles { min-width: 0; flex: 1; }
        .titles strong {
            display: block;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .titles span {
            display: block;
            font-size: 11.5px;
            color: #9fb0cc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .actions { flex: none; display: flex; gap: 8px; }
        button {
            border: 1px solid rgba(79, 216, 180, 0.3);
            border-radius: 7px;
            background: transparent;
            color: #e8eefc;
            font: inherit;
            font-size: 12px;
            padding: 6px 10px;
            cursor: pointer;
        }
        button { transition: background 120ms ease, border-color 120ms ease; }
        button:hover { background: rgba(79, 216, 180, 0.14); border-color: rgba(140, 233, 208, 0.55); }
        button:focus-visible { outline: 2px solid #8ce9d0; outline-offset: 2px; }
        main {
            flex: 1;
            display: grid;
            place-items: center;
            padding: 24px;
            text-align: center;
        }
        .empty { max-width: 460px; }
        .empty h1 { font-size: 16px; margin: 0 0 8px; }
        .empty p { margin: 0 0 6px; font-size: 13px; line-height: 1.55; color: #9fb0cc; }
        .status { font-size: 12px; color: #8ce9d0; }
    </style>
</head>
<body>
    <header>
        <div class="mark">◧</div>
        <div class="titles">
            <strong id="app-name">App window</strong>
            <span id="app-note">This window belongs to RunContainer.</span>
        </div>
        <div class="actions">
            <button id="stop">Stop app</button>
            <button id="release">Release window</button>
            <button id="main">RunContainer</button>
        </div>
    </header>
    <main>
        <div class="empty">
            <h1>Loading the app window…</h1>
            <p id="status" class="status">Waiting for the window to appear.</p>
            <p>If Windows refuses to host it here, RunContainer says so and the app keeps its own window. Hosting is presentation only and does not change isolation.</p>
        </div>
    </main>
    <script src="./guest-window.js"></script>
</body>
</html>
