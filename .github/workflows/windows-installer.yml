name: Windows installer (electron-builder test build)

# Manual, artifact-only build of the electron-builder NSIS package.
# Stable releases are owned by release.yml, which builds the Inno Setup installer
# the in-app updater is written for (stable AppId for in-place upgrades, and the
# /SP- /NORESTART install flags). This workflow deliberately has no tag trigger:
# two workflows publishing on the same tag would race and attach two different
# installers to one release.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Match the npm version that wrote the lock file
        run: npm install -g npm@11

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist

      - name: Write checksum
        shell: bash
        run: |
          cd dist
          sha256sum RunContainer-Stable-Setup-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RunContainer-Stable-Setup
          path: |
            dist/RunContainer-Stable-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error


