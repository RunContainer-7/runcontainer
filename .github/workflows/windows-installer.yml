name: Windows installer

# Builds the NSIS setup .exe on a real Windows runner and uploads it as a workflow artifact.
# Manual only. It does not create a release.

on:
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Match the npm version that wrote the lock file
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RunContainer-Setup
          path: dist/*.exe
          if-no-files-found: error
