name: Windows installer

# Builds the NSIS setup .exe on a real Windows runner.
# Pushing a tag v<version> (for example v0.5.1) builds the installer and creates a Stable GitHub release
# with the .exe and SHA256SUMS.txt attached. workflow_dispatch builds an artifact only, for test builds.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Match the npm version that wrote the lock file
        run: npm install -g npm@11

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist

      - name: Write checksum
        shell: bash
        run: |
          cd dist
          sha256sum RunContainer-Setup-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RunContainer-Setup
          path: |
            dist/RunContainer-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create Stable release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/RunContainer-Setup-*.exe dist/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "RunContainer ${GITHUB_REF_NAME#v}" \
            --notes-file "release-notes/${GITHUB_REF_NAME}.md" \
            --latest
