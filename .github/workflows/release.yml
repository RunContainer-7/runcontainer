name: Stable release

# How users get updates:
# - Installed users: the app checks the latest stable GitHub Release and shows
#   an in-app notice with a one-click installer download.
# - New users: the installer exe is attached to the GitHub Release itself, so
#   the docs and the release page always point at the newest Setup file.
#
# Cut a stable release by tagging: git tag v0.7.1 && git push origin v0.7.1
# Tags must match package.json. Pre-releases are manual (mark the release
# "pre-release" on GitHub); this workflow only publishes what you tag.
#
# Stable installers are self-signed on the release runner. A self-signed
# certificate is not a publicly trusted publisher identity; Windows may warn.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # Nightly tags have their own workflow and must never become a stable release.
    if: ${{ !contains(github.ref_name, '-nightly.') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Same pin as the verification workflow: the lock file is written by npm 11,
      # and npm 10 refuses it outright (it reports missing peer entries).
      - name: Match the npm version that wrote the lock file
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron runtime
        run: node node_modules/electron/install.js

      - name: Check tag matches package.json
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($pkg -ne $tag) { throw "Tag v$tag does not match package.json version $pkg." }

      - name: Unit tests
        run: npm test -- --watchAll=false

      # The .ico is generated from public/runcontainer-icon.svg. If someone edits
      # the design and forgets to regenerate, the shipped app would carry the old
      # icon everywhere; fail the release instead of shipping stale art.
      - name: Verify shipped icon matches its source design
        run: node scripts/build-app-icon.js --check

      # The active model must still match this build's feature schema and pass
      # the same gates a candidate does. This catches a stale or hand-edited
      # artefact before it ships.
      - name: Verify active RC-Brain model
        run: node scripts/promote-model.js --verify

      - name: Production build
        run: npm run build

      - name: Package app
        run: npm run package

      # Package and installer both succeed even when the app cannot resolve a
      # release repository; that combination ships an app that never notices an
      # update. Fail the release instead.
      - name: Verify packaged update repository
        run: node scripts/verify-packaged-update-repo.js

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          # The .iss defaults point at a local dev machine; CI overrides them
          # with the real checkout paths so the packaged app is what ships.
          $src = Join-Path (Get-Location) 'out\RunContainer-win32-x64'
          $out = Join-Path (Get-Location) 'out'
          if (-not (Test-Path $src)) { throw "Packaged app not found at $src." }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' /DMyAppVersion=$ver "/DMyAppSource=$src" "/DMyOutDir=$out" installer\RunContainer.iss
          # PowerShell does not fail a step on a native command's non-zero exit,
          # so propagate it explicitly: a silent compiler failure would otherwise
          # only surface later as a missing asset.
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE." }
          $setup = Join-Path $out "RunContainer-Stable-Setup-$ver.exe"
          if (-not (Test-Path $setup)) { throw "Installer was not produced at $setup." }
          Write-Output "Built $setup ($((Get-Item $setup).Length) bytes)"

      - name: Self-sign and verify the Stable installer
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          & ./scripts/sign-stable-installer.ps1 -InstallerPath "out/RunContainer-Stable-Setup-$ver.exe"

      # Stable versions already in the wild only recognize the original filename.
      # Publish an identical alias so their in-app updater can reach this release.
      - name: Create legacy installer alias
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "out/RunContainer-Stable-Setup-$ver.exe" "out/RunContainer-Setup-$ver.exe"

      - name: Attach the self-signed installer to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/RunContainer-Stable-Setup-*.exe
            out/RunContainer-Setup-*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
