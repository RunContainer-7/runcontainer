name: Stable release

# How users get updates:
# - Installed users: the app checks the latest stable GitHub Release and shows
#   an in-app notice with a one-click installer download.
# - New users: the installer exe is attached to the GitHub Release itself, so
#   the docs and the release page always point at the newest Setup file.
#
# Cut a stable release by tagging: git tag v0.7.1 && git push origin v0.7.1
# Tags must match package.json. Pre-releases are manual (mark the release
# "pre-release" on GitHub); this workflow only publishes what you tag.
#
# Code signing is optional at the workflow level: every signing step is skipped
# while the SignPath repository variables are unset, so releases keep publishing
# unsigned instead of failing on a missing token. The SignPath Foundation
# application was declined for now, because the program needs a project with more
# visible public traction, so releases stay unsigned until a signing service is
# configured.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # The SignPath signing action downloads the artifact it signs with the
  # workflow token, and naming any permission at all sets the rest to none.
  actions: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Same pin as the verification workflow: the lock file is written by npm 11,
      # and npm 10 refuses it outright (it reports missing peer entries).
      - name: Match the npm version that wrote the lock file
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron runtime
        run: node node_modules/electron/install.js

      - name: Check tag matches package.json
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($pkg -ne $tag) { throw "Tag v$tag does not match package.json version $pkg." }

      - name: Unit tests
        run: npm test -- --watchAll=false

      # The .ico is generated from public/runcontainer-icon.svg. If someone edits
      # the design and forgets to regenerate, the shipped app would carry the old
      # icon everywhere; fail the release instead of shipping stale art.
      - name: Verify shipped icon matches its source design
        run: node scripts/build-app-icon.js --check

      # The active model must still match this build's feature schema and pass
      # the same gates a candidate does. This catches a stale or hand-edited
      # artefact before it ships.
      - name: Verify active RC-Brain model
        run: node scripts/promote-model.js --verify

      - name: Production build
        run: npm run build

      - name: Package app
        run: npm run package

      # Package and installer both succeed even when the app cannot resolve a
      # release repository; that combination ships an app that never notices an
      # update. Fail the release instead.
      - name: Verify packaged update repository
        run: node scripts/verify-packaged-update-repo.js

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          # The .iss defaults point at a local dev machine; CI overrides them
          # with the real checkout paths so the packaged app is what ships.
          $src = Join-Path (Get-Location) 'out\RunContainer-win32-x64'
          $out = Join-Path (Get-Location) 'out'
          if (-not (Test-Path $src)) { throw "Packaged app not found at $src." }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' /DMyAppVersion=$ver "/DMyAppSource=$src" "/DMyOutDir=$out" installer\RunContainer.iss
          # PowerShell does not fail a step on a native command's non-zero exit,
          # so propagate it explicitly: a silent compiler failure would otherwise
          # only surface later as a missing asset.
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE." }
          $setup = Join-Path $out "RunContainer-Setup-$ver.exe"
          if (-not (Test-Path $setup)) { throw "Installer was not produced at $setup." }
          Write-Output "Built $setup ($((Get-Item $setup).Length) bytes)"

      # ---- Code signing ----------------------------------------------------
      # SignPath Foundation signs open-source Windows builds without charge, and
      # the certificate is issued to the Foundation rather than to this project.
      # Everything below is skipped until SIGNPATH_ORGANIZATION_ID exists, so an
      # unapproved project still publishes.

      # SignPath signs an artifact produced by this workflow run and nothing
      # else, which is what keeps the signed file provably built from this tag.
      - name: Upload the unsigned installer for signing
        id: unsigned-installer
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: out/RunContainer-Setup-*.exe
          if-no-files-found: error

      # Every signing request is approved by a person, so this step waits for
      # that approval instead of racing ahead and publishing an unsigned file.
      - name: Sign the installer with SignPath
        id: signpath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          # The action's own default is 10 minutes, but every signing request is
          # approved by hand, so a release cut outside working hours would fail
          # on the timeout rather than on anything being wrong.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: out/signed

      # Read the signature back off the exact file that is about to be
      # published. A signing service that reports success while leaving the
      # artifact unsigned would otherwise ship unsigned and unnoticed.
      - name: Verify the signature on the signed installer
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          $setup = Get-ChildItem 'out\signed\RunContainer-Setup-*.exe' -ErrorAction Stop | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $setup.FullName
          Write-Output "Signature status: $($sig.Status)"
          Write-Output "Signed by: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Installer is not validly signed ($($sig.Status))." }

      - name: Attach the signed installer to the GitHub Release
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: softprops/action-gh-release@v2
        with:
          files: out/signed/RunContainer-Setup-*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Attach the unsigned installer to the GitHub Release
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID == '' }}
        uses: softprops/action-gh-release@v2
        with:
          files: out/RunContainer-Setup-*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
