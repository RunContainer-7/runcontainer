name: Windows verification

# The development VM is Linux, so Windows behaviour cannot be checked there. This workflow
# runs the same checks on a real Windows runner: the unit tests, plus
# scripts/windows-verify.js, which creates a real AppContainer, verifies the container token,
# removes the profile, and exercises the sandbox deletion path (read-only files, a DENY ACL,
# a path longer than MAX_PATH and an exclusive file lock).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Unit tests
        run: npm test -- --watchAll=false

      - name: Isolation and deletion checks on real Windows
        run: node scripts/windows-verify.js

      - name: Production build
        run: npm run build
