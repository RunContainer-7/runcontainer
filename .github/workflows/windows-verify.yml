name: Windows verification

# The development VM is Linux, so Windows behaviour cannot be checked there. This workflow
# runs on a real Windows runner: unit tests, plus scripts/windows-verify.js
# (AppContainer token checks, host deletion cases, and a Hyper-V PROBE that is
# read-only plus static builder audits). windows-latest has NO nested
# virtualization, so this workflow NEVER creates a Hyper-V VM and a green run
# does NOT prove live-VM behavior. Live-VM proof is scripts/windows-hyperv-full.js,
# run manually on a capable host (see README provisioning).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Match the npm version that wrote the lock file
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Unit tests
        run: npm test -- --watchAll=false

      - name: Isolation and deletion checks on real Windows (no VM creation on CI)
        run: node scripts/windows-verify.js

      - name: Production build
        run: npm run build

      # The one promise none of the checks above can see: that pressing Run really draws
      # the app's window INSIDE a RunContainer window. This launches the built app, runs a
      # real graphical program through it, and asks Windows where that window is. It needs
      # the production build, so it runs last, and a runner with no interactive desktop
      # reports that rather than a false failure.
      - name: Window hosting on real Windows (run draws the app inside RunContainer)
        run: node scripts/windows-host-verify.js
